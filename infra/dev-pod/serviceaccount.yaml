# DM26-0670

# Who the dev container is in the cluster: up.nu applies everything Polar is made of, CRDs and namespaces included, so it is
# cluster-admin. Anyone who can exec into this namespace, or read its Secrets, can do what this account can.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: polar-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: polar-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: polar-dev
    namespace: polar-dev
