# DM26-0670

# A kubeconfig for the pod's own ServiceAccount, so up.nu (which wants KUBECONFIG) and kubectl reach the cluster from inside
# it the way they do from a machine. The token is read from its file at every request, so a rotated token is used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: polar-dev-kubeconfig
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    users:
      - name: polar-dev
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: polar-dev
    current-context: in-cluster
  # direnv's configuration (DIRENV_CONFIG): the checkout's .envrc is trusted, and does nothing in the pod (it is for a machine
  # of one's own), so a login there is not told it is blocked.
  direnv.toml: |
    [whitelist]
    exact = ["/workspace/.envrc"]
