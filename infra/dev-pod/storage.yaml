# DM26-0670

# What outlives the pod: the checkout, the Nix store (seeded from the image, so a build is not redone at every start), and
# the user's state under their home (atuin's history, ~/.config/polar-admin and polar-deploy, ~/.cache, and ~/.ssh with the pod's SSH host keys). bin/polar-dev
# sets the storage class.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polar-dev-workspace
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polar-dev-nix
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 80Gi } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polar-dev-state
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
