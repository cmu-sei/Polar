# DM26-0670

# infra/dev-pod: the dev container as a pod in the cluster, which bin/polar-dev applies with a kustomization of its own on
# top (the namespace and name suffix for the user, the image, the user's name and ids, the storage class, the state mounts
# under the user's home). You reach it over SSH: bin/polar-dev forwards local 2222 to the pod's dropbear (2223) and runs
# ssh -A, so git uses your own agent and no git key is kept in the cluster.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - serviceaccount.yaml
  - kubeconfig.yaml
  - storage.yaml
  - deployment.yaml
