[package]
name = "polar-env"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# No dependencies by default, on purpose: every crate that reads the environment can depend on
# this one without pulling anything else in. The configuration document (a populated scaffold,
# read from a file) needs JSON, so it is behind a feature that only the crates that handle it
# turn on.
[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
document = ["dep:serde", "dep:serde_json"]
