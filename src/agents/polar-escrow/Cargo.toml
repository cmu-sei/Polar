[package]
name = "polar-escrow"
version.workspace = true
edition.workspace = true
license.workspace = true

# EscrowedSecret and the context a secret is bound to, in a crate light enough for the author's tool
# (`polar-sign`): credentials_agent_common re-exports it, and carries the graph libraries this does not need.
[dependencies]
aes-gcm = "0.11.1"
rand.workspace = true
rkyv.workspace = true
rsa.workspace = true
serde.workspace = true
thiserror.workspace = true
zeroize = { version = "1.9.0", features = ["aarch64"] }
# The newer sha2 / digest 0.11 our rsa fork's Oaep requires; see credentials_agent_common's Cargo.toml.
sha2_011 = { package = "sha2", version = "0.11", default-features = false, features = ["oid"] }
