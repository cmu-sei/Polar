[package]
name = "git-repo-observer"
version.workspace = true
edition.workspace = true
license.workspace = true
# The crate also builds a discovery harness; `cargo run -p git-repo-observer` (the resolver asks the
# agent for its scaffold that way) means the agent.
default-run = "git-repo-observer"

[dependencies]
polar-scudo.workspace = true
cassini-client.workspace = true
base64.workspace = true
cassini-types.workspace = true
credentials_agent_common.workspace = true
git2.workspace = true
git-agent-common.workspace = true
polar.workspace = true
polar-agent-builder.workspace = true
polar-crypto.workspace = true
polar-escrow.workspace = true
polar-env.workspace = true
ractor.workspace = true
rkyv.workspace = true
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
serde_yaml.workspace = true

[dev-dependencies]
# Test CAs, TLS servers, a proxy and child processes (polar::egress::testing).
polar = { workspace = true, features = ["testing"] }
rand.workspace = true
rsa.workspace = true
tempfile.workspace = true
async-trait.workspace = true
# paused time, to test a schedule exactly
tokio = { workspace = true, features = ["test-util"] }


[[bin]]
name = "git-repo-observer"
path = "src/main.rs"

[[bin]]
name = "git-discovery-harness"
path = "src/bin/discover_repo.rs"
