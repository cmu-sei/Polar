[package]
name = "soft-state-processor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The state agent's writer: asks every agent about its health and writes what it hears into the graph."

[lib]
path = "src/lib.rs"

[[bin]]
name = "soft-state-processor"
path = "src/main.rs"

[dependencies]
polar-scudo.workspace = true
cassini-client.workspace = true
cassini-types.workspace = true
cert-issuer-common = { path = "../../cert-issuer/common" }
neo4rs.workspace = true
polar.workspace = true
polar-agent-builder.workspace = true
polar-env.workspace = true
# The words of pulled health on the wire, and the report.
polar-health.workspace = true
ractor.workspace = true
serde.workspace = true
serde_json.workspace = true
soft-state-common.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
polar-test-graph.workspace = true
proptest.workspace = true
