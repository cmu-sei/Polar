[package]
name = "secret-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

# The harness is built twice, once per workload (one binary per workload: docs/architecture/policy-enforcement.md):
# without features it is `secret-harness-owner`, with `intruder` it is `secret-harness-intruder`.
[features]
intruder = []

[dependencies]
polar-scudo.workspace = true
cassini-types.workspace = true
credentials_agent_common.workspace = true
polar-agent-builder.workspace = true
polar-crypto.workspace = true
polar-env.workspace = true
ractor.workspace = true
tokio.workspace = true
tracing.workspace = true

[[bin]]
name = "secret-harness"
path = "src/main.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
