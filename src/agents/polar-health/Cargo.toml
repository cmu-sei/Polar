[ package ]
name = "polar-health"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[ features ]
# Makes the health clock follow tokio's paused time, so a test of a crate that uses
# the health actor can run a whole rejuvenation or deadline in virtual time. Only for
# dev-dependencies; never enabled in a release build.
virtual-time = []

[ dependencies ]
polar-env = { workspace = true }
rand = { workspace = true }
ractor = { workspace = true }
rustls = { workspace = true }
rustls-webpki = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
x509-parser = { workspace = true }

[ dev-dependencies ]
rcgen = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
