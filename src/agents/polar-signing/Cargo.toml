[package]
name = "polar-signing"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
cert-issuer-common = { version = "1.0.0", path = "../cert-issuer/common" }
ed25519-dalek.workspace = true
p256.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
x509-parser.workspace = true

rcgen = { workspace = true, optional = true }

[features]
# Certificates and signers for tests (`polar_signing::testing`).
testing = ["dep:rcgen"]

[dev-dependencies]
# The crate's own tests use its testing module.
polar-signing = { path = ".", features = ["testing"] }
