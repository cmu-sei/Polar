[package]
name = "polar-agent-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
# The broker reads a floor from the certificate the TLS handshake gives as DER; the extractors read PEM.
base64.workspace = true
cassini-client.workspace = true
cassini-types.workspace = true
credentials_agent_common.workspace = true
cert-issuer-common = { path = "../cert-issuer/common" }
polar.workspace = true
polar-crypto.workspace = true
polar-env = { workspace = true, features = ["document"] }
serde.workspace = true
polar-health = { path = "../polar-health" }
polar-router.workspace = true
polar-permissions.workspace = true
polar-policy.workspace = true
polar-scheduler-common.workspace = true
# The state agent's questions and answers, which the state actor asks and hears (state.rs).
soft-state-common.workspace = true
polar-signing.workspace = true
# What `--version` prints and the scaffold carries as `agent.version`.
polar-version.workspace = true
rand.workspace = true
rsa.workspace = true
ractor.workspace = true
rkyv.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
polar-signing = { workspace = true, features = ["testing"] }
polar-health = { path = "../polar-health", features = ["virtual-time"] }
proptest.workspace = true
rcgen.workspace = true
tempfile.workspace = true
libc.workspace = true
tokio = { workspace = true, features = ["test-util"] }
