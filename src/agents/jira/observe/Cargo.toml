[package]
name = "jira-observer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Observer agent for Jira — polls APIs, publishes updates via Cassini broker."

[dependencies]
base64.workspace = true
polar-scudo.workspace = true
cassini-client.workspace = true
cassini-types.workspace = true
# Reads a Retry-After given as an HTTP date, and checks QUERY_DATE is a date (lib.rs, settings.rs).
chrono.workspace = true
jira_common.workspace = true
log.workspace = true
polar.workspace = true
polar-agent-builder.workspace = true
polar-env.workspace = true
ractor.workspace = true
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rkyv.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing-glog.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Test CAs, TLS servers and child processes (polar::egress::testing).
polar = { workspace = true, features = ["testing"] }
# What the observers tell the agent's health (a hold, a release), recorded by a stand-in health actor in the tests.
polar-health.workspace = true
proptest.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[[bin]]
name = "jira-observer"
path = "src/entrypoint.rs"
