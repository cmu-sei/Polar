    "cassini/client",
    "cassini/test/common",
    "cassini/test/producer",
    "cassini/test/sink",
    "cassini/types",
    "credentials-agent/admin",
    "credentials-agent/client",
    "credentials-agent/common",
    "credentials-agent/consume",
    "credentials-agent/fetcher",
    "credentials-agent/model",
    "credentials-agent/observe",
    "git/common",
    "gitlab/common",
    "gitlab/consume",
    "gitlab/observe",
    "gitlab/query",
    "gitlab/schema",
    "git/observe",
    "git/process",
    "git/controller",
    "jira/common",
    "jira/process",
    "jira/observe",
    "jwt-utils",
    "kubernetes/common",
    "kubernetes/consume",
    "kubernetes/observe",
    "lib",
    "logger",
    "openapi/common",
    "openapi/process",
    "openapi/observe",
    "polar-crypto",
    "polar-escrow",
    "polar-env",
    "polar-git-server/common",
    "polar-git-server/server",
    "polar-health",
    "polar-scudo",
    "polar-version",
    "polar-healthcheck",
    "polar-init",
    "polar-kernel-keyring",
    "polar-custody",
    "polar-custody/daemon",
    "polar-signing",
    "polar-sign",
    "polar-agent-builder",
    "polar-permissions",
    "polar-policy",
    "polar-router",
    "polar-test-graph",
    "polar-operator/common",
    "polar-operator/operator",
    "polar-operator/processor",
    "polar-cli",
    "resolver",
    "build-processor",
    "polar-scheduler/common",
    "polar-scheduler/observer",
    "polar-scheduler/processor",
    "build-processor",
    "cert-issuer/server","cert-issuer/client", "cert-issuer/common",
    "secret-harness",
