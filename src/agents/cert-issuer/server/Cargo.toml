[package]
name = "cert-issuer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
polar-scudo.workspace = true
tokio = { workspace = true, features = ["test-util"]}
x509-parser.workspace = true
base64.workspace = true
jwt_utils.workspace = true
rsa.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
thiserror.workspace = true
anyhow.workspace = true
time.workspace = true
tracing.workspace = true
async-trait.workspace = true
rcgen.workspace = true
jsonwebtoken.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true

axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
dashmap = "6"
hyper-util.workspace = true
cert-issuer-common = { path = "../common" }
polar = { path = "../../lib" }
polar-env.workspace = true
ractor.workspace = true
polar-agent-builder.workspace = true
cassini-client.workspace = true
cassini-types.workspace = true

[dev-dependencies]
# The broker's test support, which these tests include, can give the broker the custody daemon's key.
polar-custody.workspace = true
proptest.workspace = true
wiremock.workspace = true
tempfile.workspace = true
chrono.workspace = true
# The broker's end-to-end harness (cassini/broker/tests/support), which a test runs cert-issuer against: a real broker,
# and a client as the credentials agent asking for the record.
cassini-broker.workspace = true
polar-health.workspace = true
polar-policy.workspace = true
tracing-subscriber.workspace = true
# The credentials agent's asker and ledger, which the same test runs as the other side of the record.
credentials-agent-consumer = { path = "../../credentials-agent/consume" }
