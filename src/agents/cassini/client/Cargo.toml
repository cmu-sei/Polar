[package]
name = "cassini-client"
version.workspace = true
edition.workspace = true
license.workspace = true

# Expose internal types and functions for the test binary.
# Add pub(crate) visibility to: run_daemon, daemon_is_reachable, register,
# Session, BridgeMode, CompletionEvent, IpcRequest, IpcResponse,
# dispatch_to_daemon, OutputFormat
[lib]
name = "cassini_client"
path = "src/lib.rs"

[[bin]]
name = "cassini-client"
path = "src/main.rs"

[dev-dependencies]
rstest.workspace = true
assert_matches.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }

[dependencies]
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
chrono.workspace = true
anyhow.workspace = true
async-trait.workspace = true
cassini-tracing.workspace = true
cassini-types.workspace = true
opentelemetry.workspace = true
polar-custody.workspace = true
polar-env.workspace = true
polar-router.workspace = true
ractor.workspace = true
rkyv = { workspace = true }
rustls.workspace = true
socket2.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing-glog.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }
