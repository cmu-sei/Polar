[package]
name = "cassini-broker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
polar-scudo.workspace = true
rkyv = { workspace = true }
polar = { path = "../../lib" }
polar-health = { workspace = true }
polar-agent-builder.workspace = true
# The authority topics' types: the broker keeps the credentials agent's authority to decide by.
credentials_agent_common.workspace = true
# The CA the credentials agent's authority key is believed under.
polar-signing.workspace = true
# A certificate's serial, written as the ledger writes it: the broker refuses and ends a revoked one's sessions.
cert-issuer-common = { path = "../../cert-issuer/common" }
polar-custody.workspace = true
polar-env.workspace = true
async-trait.workspace = true
ractor.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-glog.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
cassini-tracing.workspace = true
cassini-types.workspace = true
url.workspace = true
opentelemetry.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
x509-parser.workspace = true

[[bin]]
name = "cassini-server"
path = "src/main.rs"

[dev-dependencies]
# The custody daemon's custodian session, end to end with the broker (docs/architecture/key-custody.md, step 5).
polar-custody-daemon.workspace = true
polar-router.workspace = true
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
cassini-client.workspace = true
rcgen.workspace = true
tempfile.workspace = true
libc.workspace = true
# A test signs the credentials agent's authority, and gives the broker's policy actor a policy.
polar-policy.workspace = true
rand.workspace = true
rsa.workspace = true
