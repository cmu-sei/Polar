[package]
name = "polar-custody"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

# The daemon: one per pod, holding the pod's mTLS keys (docs/architecture/key-custody.md).
[[bin]]
name = "polar-custody"
path = "src/main.rs"

[dependencies]
cert-issuer-common = { version = "1.0.0", path = "../cert-issuer/common" }
libc.workspace = true
rcgen.workspace = true
ring = "0.17.14"
rkyv.workspace = true
rustls.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x509-parser.workspace = true
zeroize = { version = "1.9.0", features = ["aarch64"] }

[dev-dependencies]
# The tests check signatures with a second, independent implementation.
p256.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
