[package]
name = "polar-custody-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

# What the daemon does beyond its socket: it watches, as its pod, for its own revocation
# (docs/architecture/key-custody.md, step 5). Apart from polar-custody, which the Cassini client depends on.
[lib]
path = "src/lib.rs"

# The daemon: one per pod, holding the pod's mTLS keys (docs/architecture/key-custody.md).
[[bin]]
name = "polar-custody"
path = "src/main.rs"

[dependencies]
cassini-client.workspace = true
cassini-types.workspace = true
# The credentials agent's authority, kept by the rules every agent keeps (`authority_leaf`).
credentials_agent_common.workspace = true
libc.workspace = true
polar-custody.workspace = true
# The CA the credentials agent's key is believed under (`authority_leaf`).
polar-signing.workspace = true
ractor.workspace = true
rkyv.workspace = true
rustls.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The OID of the credentials agent's signing certificate.
cert-issuer-common = { path = "../../cert-issuer/common" }
# The publisher's default is the agents' own (`POLAR_AUTHORITY_PUBLISHER`): a test holds the two together.
polar-agent-builder.workspace = true
polar-env.workspace = true
proptest.workspace = true
rand.workspace = true
rcgen.workspace = true
rsa.workspace = true
