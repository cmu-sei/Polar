[ package ]
name = "polar-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[ dependencies ]
ractor = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rkyv = { workspace = true }
uuid = { workspace = true }
polar = { workspace = true }
polar-env = { workspace = true }
cassini-client = { workspace = true }
cassini-types = { workspace = true }
credentials_agent_common = { workspace = true }
credentials-agent-client = { workspace = true }
# The plaintext of a retrieved secret is wiped when dropped.
zeroize = { version = "1.9.0", features = ["aarch64"] }
thiserror.workspace = true
# A secret and its binding are escrowed together as JSON, so a field added later does not break an old record.
serde = { workspace = true }
serde_json = { workspace = true }
cert-issuer-common = { version = "1.0.0", path = "../cert-issuer/common" }
# The custody daemon holds the escrow key, which the actor asks to unwrap; and a recipient's certificate is checked.
polar-custody.workspace = true
x509-parser.workspace = true
polar-router.workspace = true

[dev-dependencies]
# The credentials agent's escrow key, and a recipient's, RSA in the tests.
rsa.workspace = true
rand.workspace = true
# A P-256 recipient, as every agent's escrow key is now.
p256 = { workspace = true, features = ["pem"] }
wiremock.workspace = true
rcgen.workspace = true
polar-signing = { workspace = true, features = ["testing"] }
time.workspace = true
tempfile.workspace = true
