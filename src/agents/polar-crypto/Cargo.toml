[ package ]
name = "polar-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[ dependencies ]
ractor = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rkyv = { workspace = true }
uuid = { workspace = true }
polar = { workspace = true }
polar-env = { workspace = true }
cassini-client = { workspace = true }
cassini-types = { workspace = true }
credentials_agent_common = { workspace = true }
credentials-agent-client = { workspace = true }
# The plaintext of a retrieved secret is wiped when dropped.
zeroize = { version = "1.9.0", features = ["aarch64"] }
thiserror.workspace = true
# A secret and its binding are escrowed together as JSON, so a field added later does not break an old record.
serde = { workspace = true }
serde_json = { workspace = true }
rsa.workspace = true
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }
cert-issuer-common = { version = "1.0.0", path = "../cert-issuer/common" }
rand.workspace = true
polar-kernel-keyring.workspace = true
polar-router.workspace = true
# Deliberately not the plain, workspace-managed sha2 (0.10.x) --
# rsa::Oaep's own generic bounds require digest 0.11.x specifically,
# matching our rsa fork's own real dependency. See polar-kernel-
# keyring's and credentials_agent_common's own Cargo.toml for the
# same, established pattern and full reasoning.
sha2_011 = { package = "sha2", version = "0.11", default-features = false, features = ["oid"] }

[dev-dependencies]
wiremock.workspace = true
rcgen.workspace = true
polar-signing = { workspace = true, features = ["testing"] }
time.workspace = true
tempfile.workspace = true
