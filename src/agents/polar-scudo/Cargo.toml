# DM26-0670

# Scudo, LLVM's hardened allocator, built from the source of the LLVM in nixpkgs (compiler-rt/lib/scudo/standalone), as
# a Rust global allocator: for the musl allocator experiment (docs/architecture/broker-baseline.md). SCUDO_SRC names the
# source; POLAR_SCUDO_CONFIG names the configuration (configs/<name>/custom_scudo_config.h).
[package]
name = "polar-scudo"
version.workspace = true
edition.workspace = true
license.workspace = true
links = "polar_scudo"

[dependencies]

[dev-dependencies]
proptest.workspace = true

[build-dependencies]
cc = "1"
