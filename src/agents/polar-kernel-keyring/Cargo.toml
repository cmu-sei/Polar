[package]
name = "polar-kernel-keyring"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
errno.workspace = true
keyutils-raw.workspace = true
libc.workspace = true
rsa.workspace = true
# Deliberately not workspace-managed -- must match our rsa fork's own
# real dependency on digest 0.11.x precisely (oaep_decrypt_digest's
# own generic bounds require it), while the rest of this workspace
# still depends on the older, real sha2 0.10.x / digest 0.10.x.
# Cargo genuinely allows both major versions to coexist across
# independent dependency subtrees -- this crate is new and isolated
# enough that scoping the newer version here alone is safe, without
# needing to migrate every other real consumer of sha2/digest across
# this large workspace at once.
sha2 = { version = "0.11", default-features = false, features = ["oid"] }
thiserror.workspace = true
tracing.workspace = true
uninit.workspace = true

[dev-dependencies]
rand.workspace = true
