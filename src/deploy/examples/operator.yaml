---
apiVersion: v1
automountServiceAccountToken: true
kind: ServiceAccount
metadata:
  name: polar-operator
  namespace: polar-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: polar-operator
rules:
  - apiGroups:
      - polar.sei.cmu.edu
    resources:
      - polaragents
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - polar.sei.cmu.edu
    resources:
      - polaragents/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      - get
      - create
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: polar-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: polar-operator
subjects:
  - kind: ServiceAccount
    name: polar-operator
    namespace: polar-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-operator
  namespace: polar-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polar-operator
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: polar-operator
      name: polar-operator
    spec:
      containers:
        - args:
            - run
          command:
            - polar-operator
          env: []
          image: registry.example/polar-operator:latest
          name: operator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
      serviceAccountName: polar-operator
