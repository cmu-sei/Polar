name: polar-core
stages:
  - description: the PolarAgent CRD and the operator that keeps agents alive
    installCrd: true
    name: operator
    objects:
      - apiVersion: v1
        kind: Namespace
        metadata:
          name: polar
      - apiVersion: v1
        automountServiceAccountToken: true
        kind: ServiceAccount
        metadata:
          name: polar-operator
          namespace: polar
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: polar-operator
        rules:
          - apiGroups:
              - polar.sei.cmu.edu
            resources:
              - polaragents
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - polar.sei.cmu.edu
            resources:
              - polaragents/status
            verbs:
              - get
              - patch
              - update
          - apiGroups:
              - ''
            resources:
              - pods
            verbs:
              - get
              - list
              - watch
              - create
              - delete
          - apiGroups:
              - ''
            resources:
              - serviceaccounts
            verbs:
              - get
              - create
          - apiGroups:
              - ''
            resources:
              - namespaces
            verbs:
              - get
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: polar-operator
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: polar-operator
        subjects:
          - kind: ServiceAccount
            name: polar-operator
            namespace: polar
      - apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: polar-operator
          namespace: polar
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: polar-operator
          strategy:
            type: Recreate
          template:
            metadata:
              labels:
                app: polar-operator
              name: polar-operator
            spec:
              containers:
                - args:
                    - run
                  command:
                    - polar-operator
                  env: []
                  image: polar-operator:latest
                  imagePullPolicy: IfNotPresent
                  name: operator
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                    readOnlyRootFilesystem: true
                    runAsGroup: 65532
                    runAsNonRoot: true
                    runAsUser: 65532
              serviceAccountName: polar-operator
    optional: false
    secrets: []
    shared: true
    waits:
      - apiVersion: apps/v1
        equals: '1'
        field: status.readyReplicas
        kind: Deployment
        name: polar-operator
        namespace: polar
        timeoutSecs: 300
  - description: "the secrets, and the certificate issuer"
    installCrd: false
    name: issuer
    objects:
      - apiVersion: v1
        automountServiceAccountToken: true
        kind: ServiceAccount
        metadata:
          name: cert-issuer
          namespace: polar
      - apiVersion: v1
        data:
          cert-issuer.json: |
            {
              "bind_addr": "0.0.0.0:8443",
              "ca": {
                "ca_cert_path": "/home/polar/ca/ca.crt",
                "ca_key_path": "/home/polar/ca/ca.key",
                "default_lifetime": {
                  "nanos": 0,
                  "secs": 3600
                },
                "identity_lifetime_overrides": {},
                "provisioning": "self_bootstrap",
                "server_lifetime": {
                  "nanos": 0,
                  "secs": 3600
                },
                "user_lifetime": {
                  "nanos": 0,
                  "secs": 31536000
                }
              },
              "issuers": [
                {
                  "allowed_algorithms": [
                    "RS256",
                    "ES256",
                    "EdDSA"
                  ],
                  "audience": [ "polar-cert-issuer.local" ],
                  "identity_normalization": {
                    "cluster_domain": "cluster.local",
                    "strategy": "kubernetes_service_account"
                  },
                  "identity_scope_claim": null,
                  "instance_binding_claim": "kubernetes.io/pod/uid",
                  "issuer": "https://kubernetes.default.svc.cluster.local",
                  "jwks_cache_ttl_max": {
                    "nanos": 0,
                    "secs": 3600
                  },
                  "jwks_cache_ttl_min": {
                    "nanos": 0,
                    "secs": 30
                  },
                  "jwks_uri": "https://kubernetes.default.svc.cluster.local/openid/v1/jwks",
                  "workload_identity_claim": "sub"
                }
              ],
              "mtls": {
                "internal_callers": [ "credentials-agent.polar.serviceaccount.cluster.local" ],
                "server_identity": "cert-issuer.polar.svc.cluster.local"
              }
            }
        kind: ConfigMap
        metadata:
          name: cert-issuer-config
          namespace: polar
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: cert-issuer-ca
          namespace: polar
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "1Gi"
      - apiVersion: v1
        kind: Service
        metadata:
          name: cert-issuer
          namespace: polar
        spec:
          ports:
            - name: https
              port: 8443
              targetPort: 8443
          selector:
            polar.sei.cmu.edu/agent: cert-issuer
          type: ClusterIP
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        kind: PolarAgent
        metadata:
          name: cert-issuer
          namespace: polar
        spec:
          image: cert-issuer:latest
          needs: []
          pod:
            automountServiceAccountToken: true
            env:
              - name: CERT_ISSUER_CONFIG
                value: /etc/cert-issuer/cert-issuer.json
              - name: RUST_LOG
                value: "info,cert_issuer=debug"
              - name: KUBERNETES_CA_CERT
                value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            imagePullPolicy: IfNotPresent
            initContainers: []
            livenessProbe:
              failureThreshold: 3
              initialDelaySeconds: 20
              periodSeconds: 10
              tcpSocket:
                port: 8443
            ports:
              - containerPort: 8443
            runAsUser: 1000
            volumeMounts:
              - mountPath: /home/polar
                name: ca
              - mountPath: /etc/cert-issuer
                name: config
                readOnly: true
            volumes:
              - name: ca
                persistentVolumeClaim:
                  claimName: cert-issuer-ca
              - configMap:
                  name: cert-issuer-config
                name: config
          shutdownBudgetSecs: 20
    optional: false
    secrets:
      - keys:
          token:
            random: 24
        name: cassini-shutdown-token
        namespace: polar
      - group: graph
        keys:
          secret:
            id: password
            random: 16
        name: polar-graph-pw
        namespace: polar
      - group: graph
        keys:
          secret:
            template: "neo4j/{password}"
        name: neo4j-secret
        namespace: polar
    shared: true
    waits:
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        equals: Running
        field: status.phase
        kind: PolarAgent
        name: cert-issuer
        namespace: polar
        timeoutSecs: 300
  - description: "Cassini, the message broker"
    installCrd: false
    name: broker
    objects:
      - apiVersion: v1
        automountServiceAccountToken: false
        kind: ServiceAccount
        metadata:
          name: cassini
          namespace: polar
      - apiVersion: v1
        kind: Service
        metadata:
          name: cassini-ip-svc
          namespace: polar
        spec:
          ports:
            - name: http
              port: 8080
              targetPort: 8080
          selector:
            polar.sei.cmu.edu/agent: cassini
          type: ClusterIP
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        kind: PolarAgent
        metadata:
          name: cassini
          namespace: polar
        spec:
          image: cassini:latest
          needs: []
          pod:
            env:
              - name: POLAR_HEALTH_FILE
                value: /tmp/polar-health.json
              - name: POLAR_HEALTH_CERTS
                value: /home/polar/certs/cert.pem
              - name: TLS_SERVER_CERT_CHAIN
                value: /home/polar/certs/cert.pem
              - name: TLS_SERVER_KEY
                value: /home/polar/certs/key.pem
              - name: TLS_CA_CERT
                value: /home/polar/certs/ca.pem
              - name: CASSINI_BIND_ADDR
                value: "0.0.0.0:8080"
              - name: CASSINI_SHUTDOWN_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: token
                    name: cassini-shutdown-token
            fsGroup: 1000
            imagePullPolicy: IfNotPresent
            initContainers:
              - args:
                  - "--cert"
                  - server:/home/polar/certs:ecdsa-p256:cassini-ip-svc.polar.svc.cluster.local
                command:
                  - polar-init
                env:
                  - name: POLAR_INIT_ISSUER
                    value: cert-issuer
                  - name: POLAR_INIT_CERT_ISSUER_URL
                    value: https://cert-issuer.polar.svc.cluster.local:8443
                  - name: POLAR_INIT_TOKEN_PATH
                    value: /workspace/token
                  - name: POLAR_INIT_SKIP_ESCROW_BOOTSTRAP
                    value: 'true'
                image: polar-init:latest
                imagePullPolicy: IfNotPresent
                name: polar-init
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  runAsGroup: 1000
                  runAsNonRoot: true
                  runAsUser: 1000
                volumeMounts:
                  - mountPath: /workspace
                    name: sa-token
                    readOnly: true
                  - mountPath: /home/polar/certs
                    name: polar-certs
            livenessProbe:
              exec:
                command:
                  - polar-healthcheck
              failureThreshold: 2
              initialDelaySeconds: 150
              periodSeconds: 30
              timeoutSeconds: 5
            ports:
              - containerPort: 8080
            runAsUser: 1000
            volumeMounts:
              - mountPath: /home/polar/certs
                name: polar-certs
                readOnly: true
            volumes:
              - name: sa-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: polar-cert-issuer.local
                        expirationSeconds: 3600
                        path: token
              - emptyDir: {}
                name: polar-certs
          shutdownBudgetSecs: 20
    optional: false
    secrets: []
    shared: true
    waits:
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        equals: Running
        field: status.phase
        kind: PolarAgent
        name: cassini
        namespace: polar
        timeoutSecs: 300
  - description: the credentials agent and its observer
    installCrd: false
    name: credentials
    objects:
      - apiVersion: v1
        automountServiceAccountToken: false
        kind: ServiceAccount
        metadata:
          name: credentials-agent
          namespace: polar
      - apiVersion: v1
        automountServiceAccountToken: false
        kind: ServiceAccount
        metadata:
          name: credentials-agent-observer
          namespace: polar
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: credentials-agent-data
          namespace: polar
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "1Gi"
      - apiVersion: v1
        kind: Service
        metadata:
          name: credentials-agent-observer
          namespace: polar
        spec:
          ports:
            - name: http
              port: 8080
              targetPort: 8080
          selector:
            polar.sei.cmu.edu/agent: credentials-agent-observer
          type: ClusterIP
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        kind: PolarAgent
        metadata:
          name: credentials-agent
          namespace: polar
        spec:
          image: credentials-agent-consumer:latest
          needs:
            - cassini
          pod:
            env:
              - name: TLS_CA_CERT
                value: /home/polar/certs/ca.pem
              - name: TLS_CLIENT_CERT
                value: /home/polar/certs/cert.pem
              - name: TLS_CLIENT_KEY
                value: /home/polar/certs/key.pem
              - name: BROKER_ADDR
                value: cassini-ip-svc.polar.svc.cluster.local:8080
              - name: CASSINI_SERVER_NAME
                value: cassini.polar.serviceaccount.cluster.local
              - name: POLAR_HEALTH_FILE
                value: /tmp/polar-health.json
              - name: POLAR_HEALTH_CERTS
                value: /home/polar/certs/cert.pem
              - name: CREDENTIALS_AGENT_CERT_ISSUER_URL
                value: https://cert-issuer.polar.svc.cluster.local:8443
              - name: GRAPH_ENDPOINT
                value: bolt://polar-db-svc.polar.svc.cluster.local:7687
              - name: GRAPH_DB
                value: neo4j
              - name: GRAPH_USER
                value: neo4j
              - name: GRAPH_PASSWORD
                valueFrom:
                  secretKeyRef:
                    key: secret
                    name: polar-graph-pw
            fsGroup: 1000
            imagePullPolicy: IfNotPresent
            initContainers:
              - args:
                  - "--cert"
                  - client:/home/polar/certs:ecdsa-p256
                command:
                  - polar-init
                env:
                  - name: POLAR_INIT_ISSUER
                    value: cert-issuer
                  - name: POLAR_INIT_CERT_ISSUER_URL
                    value: https://cert-issuer.polar.svc.cluster.local:8443
                  - name: POLAR_INIT_TOKEN_PATH
                    value: /workspace/token
                  - name: POLAR_INIT_SKIP_ESCROW_BOOTSTRAP
                    value: 'true'
                image: polar-init:latest
                imagePullPolicy: IfNotPresent
                name: polar-init
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  runAsGroup: 1000
                  runAsNonRoot: true
                  runAsUser: 1000
                volumeMounts:
                  - mountPath: /workspace
                    name: sa-token
                    readOnly: true
                  - mountPath: /home/polar/certs
                    name: polar-certs
            livenessProbe:
              exec:
                command:
                  - polar-healthcheck
              failureThreshold: 2
              initialDelaySeconds: 150
              periodSeconds: 30
              timeoutSeconds: 5
            ports: []
            runAsUser: 1000
            volumeMounts:
              - mountPath: /home/polar/certs
                name: polar-certs
                readOnly: true
              - mountPath: /var/lib/credentials-agent
                name: data
            volumes:
              - name: sa-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: polar-cert-issuer.local
                        expirationSeconds: 3600
                        path: token
              - emptyDir: {}
                name: polar-certs
              - name: data
                persistentVolumeClaim:
                  claimName: credentials-agent-data
          shutdownBudgetSecs: 50
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        kind: PolarAgent
        metadata:
          name: credentials-agent-observer
          namespace: polar
        spec:
          image: credentials-agent-observer:latest
          needs:
            - cassini
          pod:
            env:
              - name: TLS_CA_CERT
                value: /home/polar/certs/ca.pem
              - name: TLS_CLIENT_CERT
                value: /home/polar/certs/cert.pem
              - name: TLS_CLIENT_KEY
                value: /home/polar/certs/key.pem
              - name: BROKER_ADDR
                value: cassini-ip-svc.polar.svc.cluster.local:8080
              - name: CASSINI_SERVER_NAME
                value: cassini.polar.serviceaccount.cluster.local
              - name: POLAR_HEALTH_FILE
                value: /tmp/polar-health.json
              - name: POLAR_HEALTH_CERTS
                value: /home/polar/certs/cert.pem
            fsGroup: 1000
            imagePullPolicy: IfNotPresent
            initContainers:
              - args:
                  - "--cert"
                  - client:/home/polar/certs:ecdsa-p256
                command:
                  - polar-init
                env:
                  - name: POLAR_INIT_ISSUER
                    value: cert-issuer
                  - name: POLAR_INIT_CERT_ISSUER_URL
                    value: https://cert-issuer.polar.svc.cluster.local:8443
                  - name: POLAR_INIT_TOKEN_PATH
                    value: /workspace/token
                  - name: POLAR_INIT_SKIP_ESCROW_BOOTSTRAP
                    value: 'true'
                image: polar-init:latest
                imagePullPolicy: IfNotPresent
                name: polar-init
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
                  runAsGroup: 1000
                  runAsNonRoot: true
                  runAsUser: 1000
                volumeMounts:
                  - mountPath: /workspace
                    name: sa-token
                    readOnly: true
                  - mountPath: /home/polar/certs
                    name: polar-certs
            livenessProbe:
              exec:
                command:
                  - polar-healthcheck
              failureThreshold: 2
              initialDelaySeconds: 150
              periodSeconds: 30
              timeoutSeconds: 5
            ports:
              - containerPort: 8080
            runAsUser: 1000
            volumeMounts:
              - mountPath: /home/polar/certs
                name: polar-certs
                readOnly: true
            volumes:
              - name: sa-token
                projected:
                  sources:
                    - serviceAccountToken:
                        audience: polar-cert-issuer.local
                        expirationSeconds: 3600
                        path: token
              - emptyDir: {}
                name: polar-certs
          shutdownBudgetSecs: 40
    optional: false
    secrets: []
    shared: true
    waits:
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        equals: Running
        field: status.phase
        kind: PolarAgent
        name: credentials-agent
        namespace: polar
        timeoutSecs: 300
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        equals: Running
        field: status.phase
        kind: PolarAgent
        name: credentials-agent-observer
        namespace: polar
        timeoutSecs: 300
  - description: "the graph, with a password (development grade: no TLS)"
    installCrd: false
    name: graph
    objects:
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: polar-db-data
          namespace: polar
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: "5Gi"
      - apiVersion: v1
        kind: Service
        metadata:
          name: polar-db-svc
          namespace: polar
        spec:
          ports:
            - name: bolt
              port: 7687
              targetPort: 7687
          selector:
            polar.sei.cmu.edu/agent: polar-neo4j
          type: ClusterIP
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        kind: PolarAgent
        metadata:
          name: polar-neo4j
          namespace: polar
        spec:
          image: neo4j:5.26.2
          needs: []
          pod:
            env:
              - name: NEO4J_AUTH
                valueFrom:
                  secretKeyRef:
                    key: secret
                    name: neo4j-secret
              - name: NEO4J_server_memory_heap_initial__size
                value: "512m"
              - name: NEO4J_server_memory_heap_max__size
                value: "512m"
              - name: NEO4J_server_memory_pagecache_size
                value: "256m"
            fsGroup: 7474
            imagePullPolicy: IfNotPresent
            initContainers: []
            livenessProbe:
              failureThreshold: 5
              initialDelaySeconds: 90
              periodSeconds: 15
              tcpSocket:
                port: 7687
            ports:
              - containerPort: 7687
            readOnlyRootFilesystem: false
            runAsUser: 7474
            volumeMounts:
              - mountPath: /data
                name: data
            volumes:
              - name: data
                persistentVolumeClaim:
                  claimName: polar-db-data
          shutdownBudgetSecs: 20
    optional: false
    secrets: []
    shared: true
    waits:
      - apiVersion: polar.sei.cmu.edu/v1alpha1
        equals: Running
        field: status.phase
        kind: PolarAgent
        name: polar-neo4j
        namespace: polar
        timeoutSecs: 300
