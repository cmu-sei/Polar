---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polar-db-data
  namespace: polar
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: polar-db-svc
  namespace: polar
spec:
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
  selector:
    name: polar-neo4j
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polar-neo4j
  namespace: polar
spec:
  replicas: 1
  selector:
    matchLabels:
      name: polar-neo4j
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        name: polar-neo4j
      name: polar-neo4j
    spec:
      containers:
        - env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  key: secret
                  name: neo4j-secret
            - name: NEO4J_server_memory_heap_initial__size
              value: "512m"
            - name: NEO4J_server_memory_heap_max__size
              value: "512m"
            - name: NEO4J_server_memory_pagecache_size
              value: "256m"
          image: neo4j:5.26.2
          imagePullPolicy: IfNotPresent
          name: neo4j
          ports:
            - containerPort: 7687
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: polar-db-data
