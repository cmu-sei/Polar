# Cyclops, the authoritative builder, on the ACE fork.
#
# A workspace of its own, in the same branch as the rest: the crates here are the public lineage's
# `build-orchestrator` (src/agents/build-orchestrator) ported to the fork's libraries, which are not the
# public ones (both are called `polar`), so the two cannot be built in one workspace. The fork is a sibling
# checkout: ~/projects/ACE next to ~/projects/Polar, the way Blitz finds this repository.
#
# What is not ported: the Podman backend, and dependency analysis (the analysis scheduler, and the events and
# graph nodes it needs, which the fork's library does not have yet). CI builds from git are.

[workspace]
resolver = "2"
members = ["core", "k8s", "agent"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["David Shepard", "Vaughn Coates"]

[workspace.dependencies]
# The fork.
cassini-client = { path = "../../../../ACE/src/agents/cassini/client" }
cassini-types = { path = "../../../../ACE/src/agents/cassini/types" }
git-agent-common = { path = "../../../../ACE/src/agents/git/common" }
polar = { path = "../../../../ACE/src/agents/lib" }
polar-agent-builder = { path = "../../../../ACE/src/agents/polar-agent-builder" }
polar-env = { path = "../../../../ACE/src/agents/polar-env" }

# This workspace.
orchestrator-core = { path = "core" }
orchestrator-backend-k8s = { path = "k8s" }

anyhow = "1.0.102"
async-trait = "0.1.89"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3 = "1"
bytes = "1.11.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
config = "0.14"
futures = "0.3.32"
http-body-util = "0.1.3"
hyper = "1.9.0"
hyper-util = { version = "0.1.20", features = ["client"] }
k8s-openapi = { version = "0.27", features = ["v1_35", "schemars"] }
kube = { version = "3.1.0", default-features = false, features = ["client", "rustls-tls", "runtime", "derive"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
ractor = { version = "0.15.10", features = ["async-trait"] }
rkyv = "0.8.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tracing = "0.1.44"
uuid = { version = "1.21.0", features = ["v4", "serde"] }

[patch.crates-io]
getrandom = { git = "https://github.com/rust-random/getrandom", tag = "v0.3.3" }
